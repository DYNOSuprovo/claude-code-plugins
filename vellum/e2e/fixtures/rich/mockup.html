<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inspection form, offline</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #1d2330; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: #1d2330; color: #fff; }
  header .pending { margin-left: auto; background: #f5a524; color: #1d2330; border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 600; }
  main { max-width: 720px; margin: 24px auto; background: #fff; border-radius: 10px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  h1 { font-size: 20px; margin: 0 0 16px; }
  label { display: block; font-weight: 600; margin: 16px 0 6px; }
  input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid #c7ccd6; border-radius: 6px; font: inherit; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 24px; }
  button { padding: 8px 16px; border-radius: 6px; border: 1px solid #1d2330; background: #fff; font: inherit; cursor: pointer; }
  button.primary { background: #2451d6; border-color: #2451d6; color: #fff; }
  .offline { background: #fff4e0; border-left: 4px solid #f5a524; padding: 10px 14px; border-radius: 6px; }
</style>
</head>
<body>
<header>
  <strong>FieldCheck</strong>
  <span>Building 14, level -2</span>
  <span class="pending">3 drafts pending</span>
</header>
<main>
  <p class="offline">You are offline. Your answers are saved on this tablet and sent when the network returns.</p>
  <h1>Roof and structure inspection</h1>
  <div class="row">
    <div><label for="site">Site</label><input id="site" value="Rue des Tanneurs 14"></div>
    <div><label for="date">Date</label><input id="date" type="date" value="2026-09-22"></div>
  </div>
  <label for="roof">Roof condition</label>
  <select id="roof"><option>Good</option><option selected>Needs repair</option><option>Unsafe</option></select>
  <label for="notes">Notes</label>
  <textarea id="notes" rows="4">Two cracked tiles above the north stairwell. Gutter partly blocked.</textarea>
  <div class="actions">
    <button type="button">Save draft</button>
    <button type="button" class="primary" id="submit">Submit report</button>
  </div>
</main>
<script>
  document.getElementById("submit").addEventListener("click", () => {
    document.querySelector(".pending").textContent = "4 drafts pending";
  });
</script>
</body>
</html>
